name: CI

on:
  push:
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.3', '7.4', '8.0', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP syntax
        run: find appinfo lib templates -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Translation JSON
        run: python3 -m json.tool l10n/de.json >/dev/null
      - name: Parse appinfo XML
        run: php -r '$x = simplexml_load_file("appinfo/info.xml"); if ($x === false) { exit(1); }'
      - name: Unit and contract tests
        if: matrix.php != '7.3' && matrix.php != '7.4'
        run: php tests/run.php
